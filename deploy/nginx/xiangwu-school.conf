server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;
    root /var/lib/xiangwu/site/current;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /api/public/leads/form {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18081/api/public/leads/form;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ { return 404; }
    location /_astro/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico)$ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ $uri/index.html @cms_redirect; }
    location @cms_redirect {
        proxy_pass http://127.0.0.1:18081/api/public/cms/redirect?path=$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
}

